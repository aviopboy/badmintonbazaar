openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Shared Badminton Bazaar order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List shared orders
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Shared orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create or import an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: Existing order returned during browser-history import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
  /orders/{id}:
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update an order review status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OrderItem:
      type: object
      properties:
        name:
          type: string
        brand:
          type: string
        price:
          type: number
        quantity:
          type: integer
      required: [name, brand, price, quantity]
    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        customerName:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        additionalContact:
          type: string
        paymentReference:
          type: string
        paymentProof:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        reviewMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          type: number
      required:
        - id
        - userId
        - customerName
        - email
        - phone
        - address
        - additionalContact
        - paymentReference
        - paymentProof
        - status
        - reviewMessage
        - createdAt
        - items
        - total
    CreateOrderBody:
      allOf:
        - $ref: "#/components/schemas/Order"
    UpdateOrderBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        reviewMessage:
          type: string
      required: [status, reviewMessage]
